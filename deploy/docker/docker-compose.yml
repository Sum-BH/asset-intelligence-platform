name: aip

services:
  postgres:
    image: postgres:16-alpine
    container_name: aip-postgres
    environment:
      POSTGRES_USER: aip
      POSTGRES_PASSWORD: aip_local_only
      POSTGRES_DB: mlflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aip -d mlflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    container_name: aip-mlflow
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://aip:aip_local_only@postgres:5432/mlflow
      --artifacts-destination /mlartifacts
      --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlartifacts:/mlartifacts
    restart: unless-stopped

  # --- Later-phase services, off by default via profiles ---
  qdrant:
    image: qdrant/qdrant:v1.9.4
    container_name: aip-qdrant
    profiles: ["rag"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.1.7
    container_name: aip-redpanda
    profiles: ["streaming"]
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    restart: unless-stopped

volumes:
  pgdata:
  mlartifacts:
  qdrant_storage:
  redpanda_data:
