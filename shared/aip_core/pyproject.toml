[project]
name = "aip-core"
version = "1.0.0"
description = "Shared core: config, logging, paths, dataset registry for the Asset Intelligence Platform."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aip_core"]
