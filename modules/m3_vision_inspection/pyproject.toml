[project]
name = "aip-vision"
version = "1.0.0"
description = "Module 3: visual anomaly detection, defect detection, thermal, VLM description."
requires-python = ">=3.11,<3.13"
dependencies = ["aip-core", "numpy>=1.26", "scipy>=1.13", "pillow>=10.0", "scikit-learn>=1.5", "matplotlib>=3.9", "pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aip_vision"]
