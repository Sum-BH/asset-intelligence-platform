[project]
name = "aip-rag"
version = "1.0.0"
description = "Module 4: local RAG knowledge base and diagnostic report generation."
requires-python = ">=3.11,<3.13"
dependencies = ["aip-core", "qdrant-client>=1.9", "rank-bm25>=0.2", "requests>=2.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aip_rag"]
