[project]
name = "aip-agents"
version = "1.0.0"
description = "Module 5: LangGraph agents, OR-Tools optimizer, MCP server, eval harness."
requires-python = ">=3.11,<3.13"
dependencies = [
    "aip-core",
    "ortools>=9.10",
    "pydantic>=2.7",
    "duckdb>=1.0",
    "polars>=1.0",
    "rank-bm25>=0.2",
    "pyyaml>=6.0",
    "langgraph>=1.2.9",
    "mcp>=1.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aip_agents"]
