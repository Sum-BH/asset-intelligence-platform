[project]
name = "aip-signal"
version = "1.0.0"
description = "Module 2: signal features, anomaly detection, RUL forecasting, MLflow tracking."
requires-python = ">=3.11,<3.13"
dependencies = [
    "aip-core",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "mlflow>=2.14",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aip_signal"]
