[project]
name = "aip-data"
version = "1.0.0"
description = "Module 1: ingestion, data model (DuckDB/Parquet), KPI analytics."
requires-python = ">=3.11,<3.13"
dependencies = [
    "aip-core",
    "duckdb>=1.0",
    "polars>=1.0",
    "pyarrow>=16.0",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aip_data"]
