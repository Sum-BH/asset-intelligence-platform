[project]
name = "aip-serve"
version = "1.0.0"
description = "Module 6: FastAPI service layer, registry, drift monitoring, deployment."
requires-python = ">=3.11,<3.13"
dependencies = ["aip-core", "aip-agents", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pydantic>=2.7", "duckdb>=1.0", "mlflow>=2.14", "scipy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aip_serve"]
